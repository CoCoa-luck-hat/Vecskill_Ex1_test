services:
  # 1. MySQL Database Service (Dev)
  db:
    image: mysql:8.0
    container_name: repair_db_dev
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=repair_system
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 2. Backend Service with Hot-Reload (Dev)
  backend:
    container_name: repair_backend_dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: npm run dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env.dev
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_dev_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # 3. Frontend Service with Vite Hot-Reload (Dev)
  frontend:
    container_name: repair_frontend_dev
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_dev_data:
    driver: local
  backend_dev_uploads:
    driver: local
