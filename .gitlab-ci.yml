variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

stages:
  - test
  - build
  - deploy

test:backend:
  stage: test
  image: node:20-alpine
  before_script:
    - node --version
    - npm --version
  script:
    - cd backend
    - npm install
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:frontend:
  stage: test
  image: node:20-alpine
  before_script:
    - node --version
    - npm --version
  script:
    - cd frontend
    - npm install
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build:docker:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker build -t repair-backend:latest ./backend
    - docker build -t repair-frontend:latest ./frontend
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

deploy:production:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker compose -f docker-compose.prod.yml down --remove-orphans || true
    - docker compose -f docker-compose.prod.yml up -d --build
    - docker compose -f docker-compose.prod.yml ps
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: on_success
    - when: manual
  environment:
    name: production
