# GitLab CI/CD Pipeline for Repair Request System (Ex2)
# Stages: test -> build -> deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

stages:
  - test
  - build
  - deploy

# ==========================================
# 1. STAGE: TEST (Auto trigger on Push)
# ==========================================
test:backend:
  stage: test
  image: node:20-alpine
  before_script:
    - node --version
    - npm --version
  script:
    - cd backend
    - npm install
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:frontend:
  stage: test
  image: node:20-alpine
  before_script:
    - node --version
    - npm --version
  script:
    - cd frontend
    - npm install
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ==========================================
# 2. STAGE: BUILD DOCKER IMAGES
# ==========================================
build:docker:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "Building Backend Docker Image..."
    - docker build -t repair-backend:latest ./backend
    - echo "Building Frontend Docker Image..."
    - docker build -t repair-frontend:latest ./frontend
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

# ==========================================
# 3. STAGE: DEPLOY (Auto deploy on main/master)
# ==========================================
deploy:production:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "Deploying to Production Server via docker-compose.prod.yml..."
    - docker compose -f docker-compose.prod.yml down --remove-orphans || true
    - docker compose -f docker-compose.prod.yml up -d --build
    - docker compose -f docker-compose.prod.yml ps
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: on_success
    - when: manual
  environment:
    name: production
